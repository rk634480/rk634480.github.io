<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    .box {
      margin: 20px;      /* 제목과 20px 간격 */
      padding: 15px;     /* 내부 여백 */
    }

    .hello {
      color: red;        /* 글자 속성 */
      font-size: 20px;
      font-weight: bold;
    }

    .world {
      background-color: lightblue; /* 배경색 */
    }
  </style>
</head>
<body>

  <h1>제목</h1>

  <div class="box hello">hello</div>
  <div class="box world">world</div>

</body>
</html>
