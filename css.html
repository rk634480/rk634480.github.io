<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    .box {
      margin: 20px;      /* 제목과의 외부 간격 */
      padding: 15px;     /* 내부 간격 */
    }

    .hello {
      color: blue;       /* 글자색 */
    }

    .world {
      background-color: lightgray;  /* 배경색 */
    }
  </style>
</head>
<body>

  <h1>제목</h1>

  <div class="box hello">hello</div>
  <div class="box world">world</div>

</body>
</html>
