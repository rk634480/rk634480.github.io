<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>CSS 과제</title>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      font-size: 16px;
      margin-left: 20px; /* 좌측 여백 조금 줌 */
    }

    /* 제목 */
    h1 {
      display: inline-block;
      border: 1px solid #333; 
      padding: 4px 8px;
      margin-bottom: 20px; 
    }

    /* hello + world 컨테이너 */
    .container {
      display: flex;
      gap: 12px;
    }

    /* hello: 글자 속성 */
    .hello {
      font-size: 18px;
      color: #007bff;
    }

    /* world: 배경색, padding 축소 */
    .world {
      background-color: #4CAF50;
      color: #fff;
      padding: 2px 6px; /* ← 기존보다 5px 정도 줄임 */
      font-size: 16px;
    }
  </style>
</head>

<body>

  <h1>제목</h1>

  <div class="container">
    <div class="hello">hello</div>
    <div class="world">world</div>
  </div>

</body>
</html>
