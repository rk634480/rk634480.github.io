<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>CSS 실습</title>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      font-size: 16px;
      text-align: left;
    }

    /* 제목 */
    h1 {
      display: inline-block;   /* 테두리 글자 길이만 */
      border: 1px solid #333;
      padding: 4px 8px;
      margin-bottom: 20px;
    }

    /* 제목을 중앙으로 보내기 위한 최소 수정 */
    body {
      text-align: center;
    }

    /* 컨텐츠는 다시 좌측 정렬 */
    .container {
      display: flex;
      gap: 12px;
      justify-content: flex-start;
      text-align: left;
    }

    .hello {
      font-size: 18px;
      color: #007bff;
    }

    .world {
      background-color: #4CAF50;
      color: #fff;
      padding: 2px 6px;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <h1>CSS 실습</h1>

  <div class="container">
    <div class="hello">hello</div>
    <div class="world">world</div>
  </div>

</body>
</html>
