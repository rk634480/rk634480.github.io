<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>ERP Practice Page</title>
  <style>
    /* 전체 컨테이너 */
    .container {
      display: flex;          /* 좌우 배치 */
      justify-content: flex-start; /* 좌측 정렬 */
      align-items: center;    /* 세로 가운데 정렬 */
      gap: 12px;              /* hello와 world 사이 간격 */
      padding: 20px;
    }

    /* hello: 글자 속성 */
    .hello {
      font-size: 20px;
      font-weight: bold;
      color: #222;
    }

    /* world: 배경색 */
    .world {
      background-color: #4CAF50;
      color: white;
      padding: 6px 12px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="hello">hello</div>
    <div class="world">world</div>
  </div>

</body>
</html>
