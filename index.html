<!DOCTYPE html> 
<html lang="ko"> 
<head>
    <meta charset="UTF-8"> 
    <title>내 첫 웹사이트</title> 
    <style>
        /* 기존 스타일 */
        #form_container { 
            display: inline-block; 
            width: fit-content; 
            border: 1px solid black; 
            padding: 15px;
        }
        label {
            display: inline-block; 
            width: 50px; 
            text-align: right;
        }
        div.btn_div {
            margin-top: 10px;
        }
        .btn_div {
            text-align: center;
        }

        /* 🔽 원래 요청에서 추가된 스타일 */
        .box {
            margin: 20px;      /* 제목과 20px 간격 */
            padding: 15px;     /* 내부 간격 */
        }
        .hello {
            color: blue;       /* 글자 속성 */
            font-weight: bold;
        }
        .world {
            background-color: lightyellow; /* 배경색 */
        }
    </style>
</head> 

<body>
    <h1>안녕하세요!</h1> 
    <p>이건 기본 HTML 페이지입니다.</p>

    <!-- 원래 요청 반영 -->
    <div class="box hello">hello</div>
    <div class="box world">world</div>

    <!-- 기존 로그인 폼 -->
    <div id="form_container"> 
        <form> 
            <div>
                <label for="uid">아이디</label> 
                <input type="text" name="uid" id="uid">
            </div>   
            <div> 
                <label for="pwd">암호</label> 
                <input type="password" name="pwd" id="pwd"> 
            </div>
            <div class="btn_div"> 
                <button type="submit">로그인</button>
            </div> 
        </form> 
    </div>
</body>
</html>
