<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>ERP 연습 페이지</title>
  <style>
    /* 제목 */
    .title {
      display: inline-block;      /* 핵심: 글자 길이만큼만 */
      font-size: 24px;
      font-weight: bold;
      padding: 10px;
      border: 1px solid #000;
      margin-bottom: 20px;        /* 제목과 아래 요소 20px */
    }

    /* hello + world 영역 */
    .content {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 12px;
    }

    /* hello: 글자 속성 */
    .hello {
      font-size: 18px;
      color: #222;
    }

    /* world: 배경색 */
    .world {
      background-color: #4CAF50;
      color: #fff;
      padding: 6px 12px;
    }
  </style>
</head>
<body>

  <!-- 제목 -->
  <div class="title">ERP 연습용 페이지</div>

  <!-- hello / world -->
  <div class="content">
    <div class="hello">hello</div>
    <div class="world">world</div>
  </div>

</body>
</html>
