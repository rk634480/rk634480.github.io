<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>CSS 실습</title>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      font-size: 16px;
      text-align: left;
    }

    /* 제목 */
    h1 {
      display: inline-block;     /* 글자 길이만큼만 */
      border: 1px solid #333;    /* 1px 테두리 */
      padding: 4px 8px;          /* 제목 여백 축소 */
      margin-bottom: 20px;       /* 아래와 20px */
    }

    /* hello + world 컨테이너 */
    .container {
      display: flex;             /* 좌우 배치 */
      gap: 12px;
    }

    /* hello : 글자 속성 */
    .hello {
      font-size: 18px;
      color: #007bff;
    }

    /* world : 배경색 (여백 축소된 상태) */
    .world {
      background-color: #4CAF50;
      color: #fff;
      padding: 2px 6px;          /* 배경/글자 여백 줄임 */
      font-size: 16px;
    }
  </style>
</head>

<body>

  <h1>CSS 실습</h1>

  <div class="container">
    <div class="hello">hello</div>
    <div class="world">world</div>
  </div>

</body>
</html>
