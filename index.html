<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>CSS 실습</title>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      font-size: 16px;
      text-align: left;
      padding: 20px;
    }

    /* 제목을 중앙 정렬 */
    .title-wrapper {
      text-align: center;   /* 부모에서 중앙 */
      margin-bottom: 20px;  /* 아래와 20px */
    }

    h1 {
      display: inline-block;     /* 글자 길이만큼 border */
      border: 1px solid #333;
      padding: 4px 8px;
    }

    /* hello + world 컨테이너 */
    .container {
      display: flex;             /* 좌우 배치 */
      justify-content: flex-start; /* 좌측 정렬 */
      gap: 12px;
    }

    /* hello: 글자 속성 */
    .hello {
      font-size: 18px;
      color: #007bff;
    }

    /* world: 배경색 + 축소 여백 */
    .world {
      background-color: #4CAF50;
      color: #fff;
      padding: 2px 6px;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <!-- 제목 중앙 정렬 -->
  <div class="title-wrapper">
    <h1>CSS 실습</h1>
  </div>

  <!-- 좌측 hello/world 콘텐츠 -->
  <div class="container">
    <div class="hello">hello</div>
    <div class="world">world</div>
  </div>

</body>
</html>
