<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>CSS 선택자 연습</title>

<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    font-size: 16px;
    font-weight: 400;
  }

  /* 제목 */
  h1 {
    color: #007bff;
    background-color: rgba(0, 0, 0, 0.05);
    border: 1px solid #000;   /* 제목 1px border */
    padding: 10px;
  }

  /* 공통 박스 */
  .box {
    margin: 20px;   /* 제목과 20px 간격 */
    padding: 15px;
    border: 2px solid #ccc;
  }

  /* hello : div + 글자속성 */
  .hello {
    color: blue;              /* 글자 색상 */
    font-size: 20px;          /* 글자 크기 */
    font-weight: bold;        /* 글자 굵기 */
    font-family: Arial;       /* 글꼴 */
  }

  /* world : div + 배경색 */
  .world {
    background-color: yellow;
  }
</style>
</head>

<body>

<h1>제목</h1>

<!-- hello / world 모두 div -->
<div class="box hello">hello</div>
<div class="box world">world</div>

</body>
</html>
