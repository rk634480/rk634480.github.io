<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>CSS 속성 선택자 과제</title>

  <style>
  
    a {
      display: inline-block;
      padding: 6px 10px;
      margin: 4px;
      color: white;
      text-decoration: none;
    }

    /* home : 글자색만 파랑 */
    div > div > a {
      color: blue; 
    }
    div > div > a:hover {
  background-color: red;
}

    /* nav 안의 a들 */
    nav a:nth-child(1) { background-color: red; }
    nav a:nth-child(2) { background-color: orange; }
    nav a:nth-child(3) { background-color: yellow; color: black; }
    nav a:nth-child(4) { background-color: green; }

    /* google */
    p > a {
      background-color: blue;
    }

    /* contact */
    body > div > a:last-child {
      background-color: purple;
    }
  </style>
</head>

<body>
  <div>
    <div>
      <a>home</a>    <--글자색을 파랗게, 마우스 올리면 배경색을 적색으로-->
    </div>
<div>
  아이디<input type="tesxt" nama="uid"> <!--포커스를 받으면 outline을 청색-->
</div>
    <p>
      <nav>
        <a>python</a>
        <a>html</a>
        <a>css</a>
        <a>javascript</a>
      </nav>
      <a>google</a>
    </p>

    <a>contact</a>
  </div>
</body>
</html>
