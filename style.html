<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>전체 배경 이미지</title>

<style>
  body {
    margin: 0;  /* 기본 여백 제거 */

    background-image: url("https://i.namu.wiki/i/raIDg3TE-75MjoGGbcVzRGB3msy_vJwAi_k_L9c0SofgGIIedo8Fq_73d6w1iRMhD_K57pJs_3Pw4BXk_-8wNw.webp");
    background-size: cover;      /* 화면 꽉 채움 */
    background-position: center; /* 가운데 정렬 */
    background-repeat: no-repeat; 
    background-attachment: fixed; /* 스크롤해도 고정 */
  }

  .content {
    background: rgba(255,255,255,0.8); /* 가독성용 반투명 배경 */
    padding: 40px;
    width: 60%;
    margin: 100px auto;
    border-radius: 10px;
  }
</style>
</head>

<body>

<div class="content">
  <h1>배경 이미지 전체 적용</h1>
  <p>이 콘텐츠 뒤에 이미지가 깔립니다.</p>
</div>

</body>
</html>
