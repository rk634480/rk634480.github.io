<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>CSS 속성 선택자 과제</title>

  <style>
#uid:focus {
  outline: 2px solid blue;
  }
a {
     display: inline-block;
      padding: 6px 10px;
      margin: 4px;
      color: white;
      text-decoration: none;
  }

    /* home : 글자색만 파랑 */
    div > div > a {
      color: blue; 
  }
    div > div > a:hover {
  background-color: red;
  }

    /* nav 안의 a들 */
    nav a:nth-child(1) { background-color: red; }
    nav a:nth-child(2) { background-color: orange; }
    nav a:nth-child(3) { background-color: yellow; color: black; }
    nav a:nth-child(4) { background-color: green; }

    /* google */
    p > a {
      background-color: blue;
    }
p::before {
  content: "👉 ";
  color: orange;
}

p::after {
  content: " ✅";
  color: green;
}
    /* contact */
    body > div > a:last-child {
      background-color: purple;
    }
  </style>
</head>

<body>
  <div>
    <div>
      <a>home</a>    <!--글자색을 파랗게, 마우스 올리면 배경색을 적색으로-->
    </div>
<div>
  아이디<input type="text" name="uid" id="uid"> <!--포커스를 받으면 outline을 청색-->
</div>
    a 태그에 마우스를 올리면 왼쪽에는 오른쪽을 가리는 손가락이 표시되고 오른쪽에는 왼쪽을 가리키는 손가락이 표시되도록 해보세요
    <p>
      <nav>
        <a>python</a>
        <a>html</a>
        <a>css</a>
        <a>javascript</a>
      </nav>
      <a>google</a>
    </p>

    <a>contact</a>
  </div>
</body>
</html>
