<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>CSS 속성 선택자 과제</title>

  <style>
    /* input focus */
    #uid:focus {
      outline: 2px solid blue;
    }

    /* 기본 a 스타일 */
    a {
      display: inline-block;
      padding: 6px 10px;
      margin: 4px;
      color: white;
      text-decoration: none;
      position: relative;
    }

    /* home : 글자색만 파랑 */
    div > div > a {
      color: blue;
    }

    div > div > a:hover {
      background-color: red;
    }

    /* nav 안의 a들 */
    nav a:nth-child(1) { background-color: red; }
    nav a:nth-child(2) { background-color: orange; }
    nav a:nth-child(3) { background-color: yellow; color: black; }
    nav a:nth-child(4) { background-color: green; }

    /* google */
    p > a {
      background-color: blue;
    }

    /* hover 시 👉 👈 표시 */
    a::before,
    a::after {
      opacity: 0;
      transition: 0.2s;
    }

   a:nth-child(1):hover::before {
      content: "👉";
      margin-right: 5px;
      opacity: 1;
    }

   a:nth-child(1):hover::after {
      content: "👈";
      margin-left: 5px;
      opacity: 1;
    }

  </style>
</head>

<body>
  <div>
    <div>
      <a>home</a>
    </div>

    <div>
      아이디
      <input type="text" name="uid" id="uid">
    </div>

    <p>
      <nav>
        <a>python</a>
        <a>html</a>
        <a>css</a>
        <a>javascript</a>
      </nav>
      <a>google</a>
    </p>

    <a>contact</a>
  </div>
</body>
</html>
