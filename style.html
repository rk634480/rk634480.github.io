<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>CSS 속성 선택자 과제</title>

  <style>


    /* input focus */
    #uid:focus {
      outline: 2px solid blue;
    }

    /* 기본 a 스타일 */
    a {
      display: inline-block;
      padding: 6px 10px;
      margin: 4px;
      color: white;
      text-decoration: none;
    }

    /* home 전용 */
    .home {
      color: blue;
    }

  

    /* nav 안의 a들 */
    nav a:nth-child(1) { background-color: red; }
    nav a:nth-child(2) { background-color: orange; }
    nav a:nth-child(3) { background-color: yellow; color: black; }
    nav a:nth-child(4) { background-color: green; }

    /* google */
    nav + a {
      background-color: blue;
    }
     p + a {
      background-color: blue;
    }
    

    /* home 제외하고 hover 시 손가락 표시 */
    .home:hover::before {
      content: "👉 ";
      color: orange;
    }

    .home:hover::after {
      content: " 👈";
      color: green;
    }

  </style>
<meta charset="UTF-8">
<title>전체 배경 이미지</title>

<style>
 .container {
  display: flex;
  flex-direction: row;
  justify-content: center;
  align-items: center;
  }
  
  /* 기본 여백 제거 */

    background-image: url("rexdoll.webp");
    background-size: cover;      /* 화면 꽉 채움 */
    background-position: center; /* 가운데 정렬 */
    background-repeat: no-repeat; 
    background-attachment: fixed; /* 스크롤해도 고정 */
  }

  .content {
    background: rgba(255,255,255,0.8); /* 가독성용 반투명 배경 */
    padding: 40px;
    width: 60%;
    margin: 100px auto;
    border-radius: 10px;
  }
</style>
</head>

<body>
  <--!div태그 한개가 화명 중앙에 오도록 해보세요--
    
  <div>

    <div>
      <a class="home">home</a>
    </div>

    <div>
      아이디
      <input type="text" name="uid" id="uid">
    </div>

    <p>
      <nav>
        <a>python</a>
        <a>html</a>
        <a>css</a>
        <a>javascript</a>
      </nav>
      <a>google</a>
    </p>

    <a>contact</a>
<div class="content">
  <h1>배경 이미지 전체 적용</h1>
  <p>이 콘텐츠 뒤에 이미지가 깔립니다.</p>
</div>

  </div>
</body>
</html>
